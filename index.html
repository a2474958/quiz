    <!-- 웹 오디오 API 기반 효과음 재생 함수 -->
    <script>
        // 별도 라이브러리 없이 간단한 효과음을 만들어내는 Web Audio 헬퍼
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'correct') {
                // 딩동댕 긍정음 (도-미-솔-도)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                
                osc.start(now);
                osc.stop(now + 0.6);
            } else if (type === 'wrong') {
                // 부부- 땡 음 (저음 두 번)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(140, now + 0.15);
                
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'click') {
                // 톡 소리
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400, now);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                
                osc.start(now);
                osc.stop(now + 0.05);
            } else if (type === 'win') {
                // 승리 팡파레
                const notes = [523.25, 659.25, 783.99, 1046.50, 880, 1046.50];
                const times = [0, 0.12, 0.24, 0.36, 0.5, 0.65];
                notes.forEach((freq, i) => {
                    const noteOsc = audioCtx.createOscillator();
                    const noteGain = audioCtx.createGain();
                    noteOsc.type = 'triangle';
                    noteOsc.frequency.setValueAtTime(freq, now + times[i]);
                    noteGain.gain.setValueAtTime(0.25, now + times[i]);
                    noteGain.gain.exponentialRampToValueAtTime(0.01, now + times[i] + 0.25);
                    noteOsc.connect(noteGain);
                    noteGain.connect(audioCtx.destination);
                    noteOsc.start(now + times[i]);
                    noteOsc.stop(now + times[i] + 0.25);
                });
            }
        }
    </script>

            // 문제 필터링
            if (selectedCategory === 'all') {
                currentQuestions = [...quizDatabase];
            } else {
                currentQuestions = quizDatabase.filter(q => q.type === selectedCategory);
            }

            // 배열 랜덤 섞기 (셔플)
            currentQuestions.sort(() => Math.random() - 0.5);

            // 최대 10문제만 선택
            if (currentQuestions.length > 10) {
                currentQuestions = currentQuestions.slice(0, 10);
            }

            // 초기화
            currentQuestionIndex = 0;
            score = 0;
            correctAnswersCount = 0;
            wrongAnswersCount = 0;

            // 화면 전환
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');

            document.getElementById('total-questions-num').innerText = currentQuestions.length;
            document.getElementById('score-display').innerText = '0';

            loadQuestion();
        }

        // 문제 로드
        function loadQuestion() {
            isAnswered = false;
            const q = currentQuestions[currentQuestionIndex];

            // 진행 상태 업데이트
            document.getElementById('current-question-num').innerText = currentQuestionIndex + 1;
            const progressPercent = ((currentQuestionIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            // 질문 및 카테고리 설정
            document.getElementById('question-category').innerText = q.category;
            document.getElementById('question-text').innerHTML = q.question;

            // 피드백 박스 숨기기
            const feedbackBox = document.getElementById('feedback-box');
            feedbackBox.classList.add('hidden');
            feedbackBox.className = "hidden mt-6 p-4 rounded-2xl text-center border-2 card-pop";

            // 보기 버튼 생성
            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const colors = [
                'bg-rose-400 hover:bg-rose-500 border-rose-600 text-white',
                'bg-sky-400 hover:bg-sky-500 border-sky-600 text-white',
                'bg-amber-400 hover:bg-amber-500 border-amber-600 text-white',
                'bg-emerald-400 hover:bg-emerald-500 border-emerald-600 text-white'
            ];

            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `btn-choice w-full py-4 px-6 rounded-2xl text-xl sm:text-2xl font-bold border-b-4 transition-transform ${colors[idx % colors.length]}`;
                btn.innerHTML = `<span class="bg-white/30 text-white rounded-full px-3 py-1 mr-2 text-lg">${idx + 1}</span> ${opt}`;
                btn.onclick = () => checkAnswer(idx, btn);
                container.appendChild(btn);
            });
        }

        // 정답 확인
        function checkAnswer(selectedIndex, selectedBtn) {
            if (isAnswered) return;
            isAnswered = true;

            const q = currentQuestions[currentQuestionIndex];
            const feedbackBox = document.getElementById('feedback-box');
            const feedbackResult = document.getElementById('feedback-result');
            const feedbackExp = document.getElementById('feedback-explanation');
            const quizCard = document.getElementById('quiz-screen');

            // 모든 선택 버튼 무효화
            const buttons = document.querySelectorAll('.btn-choice');

            if (selectedIndex === q.answer) {
                // 정답!
                playSound('correct');
                score += 10;
                correctAnswersCount++;
                document.getElementById('score-display').innerText = score;

                selectedBtn.classList.add('ring-4', 'ring-green-300', 'scale-105');
                feedbackBox.classList.remove('hidden');
                feedbackBox.classList.add('bg-green-100', 'border-green-300', 'text-green-800');
                feedbackResult.innerHTML = '🎉 <span class="text-green-600">정답입니다! 잘했어요!</span> 🎉';
                
                // 폭죽 효과
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.7 }
                });

            } else {
                // 오답!
                playSound('wrong');
                wrongAnswersCount++;

                selectedBtn.classList.add('opacity-50');
                quizCard.classList.add('shake');
                setTimeout(() => quizCard.classList.remove('shake'), 500);

                // 정답 버튼 표시
                buttons[q.answer].classList.add('ring-4', 'ring-green-400', 'scale-105');

                feedbackBox.classList.remove('hidden');
                feedbackBox.classList.add('bg-red-100', 'border-red-300', 'text-red-800');
                feedbackResult.innerHTML = '💡 <span class="text-red-600">아쉬워요! 다시 확인해봐요.</span>';
            }

            feedbackExp.innerText = q.explanation;
        }

        // 다음 문제 진행
        function nextQuestion() {
            playSound('click');
            currentQuestionIndex++;

            if (currentQuestionIndex < currentQuestions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        // 결과 화면 출력
        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            const resultScreen = document.getElementById('result-screen');
            resultScreen.classList.remove('hidden');

            const finalScoreElem = document.getElementById('final-score');
            const correctCountElem = document.getElementById('correct-count');
            const wrongCountElem = document.getElementById('wrong-count');
            const praiseMsgElem = document.getElementById('praise-message');
            const emojiElem = document.getElementById('result-emoji');

            // 점수 계산 (100점 만점 환산)
            const calculatedScore = Math.round((correctAnswersCount / currentQuestions.length) * 100);

            finalScoreElem.innerText = calculatedScore;
            correctCountElem.innerText = correctAnswersCount;
            wrongCountElem.innerText = wrongAnswersCount;

            // 칭찬 메세지 설정
            if (calculatedScore === 100) {
                emojiElem.innerText = '👑';
                praiseMsgElem.innerHTML = '🌟 완벽해요! 세종대왕님도 울고 갈 최고의 <span class="text-purple-600 font-extrabold">우리말 대박사님</span>이시네요! 🌟';
                playSound('win');
                // 대형 폭죽 효과
                confetti({
                    particleCount: 150,
                    spread: 100,
                    origin: { y: 0.6 }
                });
            } else if (calculatedScore >= 80) {
                emojiElem.innerText = '🥇';
                praiseMsgElem.innerText = '대단한 실력이에요! 조금만 더 하면 만점도 문제없겠어요! 👍';
                playSound('win');
            } else if (calculatedScore >= 60) {
                emojiElem.innerText = '🥈';
                praiseMsgElem.innerText = '참 잘했어요! 우리말 표현을 많이 알고 있네요! 😊';
            } else {
                emojiElem.innerText = '🌱';
                praiseMsgElem.innerText = '차근차근 연습해보아요! 다시 도전해보면 더 높은 점수를 받을 수 있어요! 💪';
            }
        }

        // 게임 다시하기
        function restartGame() {
            startGame();
        }

        // 메인 화면으로 이동
        function goHome() {
            playSound('click');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            document.getElementById('start-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
